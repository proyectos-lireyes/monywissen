name: Compilar APK Android - Monywissen

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: 3. Instalar Dependencias
        run: npm ci || npm install

      - name: 4. Compilar Aplicación Web (Vite + React)
        run: npm run build

      - name: 5. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 6. Configurar SDK Android
        uses: android-actions/setup-android@v3

      - name: 7. Inicializar Capacitor Android (Si no existe)
        run: |
          if [ ! -d "android" ]; then
            npx cap init Monywissen com.monywissen.app --web-dir dist
            npx cap add android
          fi
          
          # Forzar versiones de androidx.core compatibles con compileSdk 35
          cat << 'INNER_EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'androidx.core:core:1.15.0'
                      force 'androidx.core:core-ktx:1.15.0'
                  }
              }
          }
INNER_EOF
          
          npx cap sync android

      - name: 8. Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: 9. Compilar APK (Release) con Gradle
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: 10. Firmar APK (Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No se encontraron los secretos de firma. Saltando la firma. Se subirá el archivo 'app-release-unsigned.apk'."
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-release.apk
          else
            echo "Decodificando el Keystore..."
            echo $KEYSTORE_BASE64 | base64 --decode > android/app/release.keystore
            echo "Firmando el APK..."
            
            # Buscar apksigner en el SDK de Android
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
            
            $APKSIGNER sign --ks android/app/release.keystore \
              --ks-key-alias $KEY_ALIAS \
              --ks-pass pass:$KEYSTORE_PASSWORD \
              --key-pass pass:$KEY_PASSWORD \
              --out android/app/build/outputs/apk/release/app-release.apk \
              android/app/build/outputs/apk/release/app-release-unsigned.apk
          fi

      - name: 11. Guardar Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: monywissen-app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 12. Renombrar APK y Preparar Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/monywissen-$VERSION.apk

      - name: 13. Crear Release en GitHub (Si es una etiqueta de versión)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/release/monywissen-*.apk
          body: |
            🎉 Nueva versión de Monywissen compilada automáticamente (Release).
            Descarga el archivo APK e instálalo en tu dispositivo Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
