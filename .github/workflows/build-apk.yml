name: Compilar APK Android - Monywissen

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: 2.5 Auto-Versionado Inteligente
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo $BASE_VERSION | cut -d. -f1,2)
          NEW_VERSION="$MAJOR_MINOR.${{ github.run_number }}"
          echo "Aplicando versión automática: $NEW_VERSION"
          npm version $NEW_VERSION --no-git-tag-version

      - name: 3. Instalar Dependencias
        run: npm ci || npm install

      - name: 4. Compilar Aplicación Web (Vite + React)
        run: npm run build

      - name: 5. Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 6. Configurar SDK Android
        uses: android-actions/setup-android@v3

      - name: 7. Inicializar Capacitor Android (Si no existe)
        run: |
          if [ ! -d "android" ]; then
            npx cap init Monywissen com.monywissen.app --web-dir dist
            npx cap add android
          fi

          # Forzar versiones de androidx.core compatibles con compileSdk 35
          echo "allprojects {" >> android/build.gradle
          echo "    configurations.all {" >> android/build.gradle
          echo "        resolutionStrategy {" >> android/build.gradle
          echo "            force 'androidx.core:core:1.15.0'" >> android/build.gradle
          echo "            force 'androidx.core:core-ktx:1.15.0'" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle

          npx cap sync android

      - name: 8. Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          validate-wrappers: false

      - name: 9. Compilar APK (Release) con Gradle
        run: |
          cd android
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 10. Firmar APK (Release)
        run: |
          echo "Firmando el APK con keystore local..."
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          $APKSIGNER sign --ks android/app/release.keystore \
            --ks-key-alias monywissen \
            --ks-pass pass:monywissen2026 \
            --key-pass pass:monywissen2026 \
            --out android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: 11. Guardar Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: monywissen-app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 12. Obtener Versión
        id: get_version
        run: echo "VERSION=v$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: 13. Renombrar APK y Preparar Release
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/monywissen-${{ env.VERSION }}.apk

      - name: 14. Crear Release en GitHub (Actualización Continua)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Monywissen ${{ env.VERSION }}
          make_latest: true
          files: |
            android/app/build/outputs/apk/release/monywissen-*.apk
          body: |
            🎉 Nueva versión de Monywissen compilada automáticamente.
            Descarga el archivo APK e instálalo en tu dispositivo Android.
            
            *(Esta versión se actualiza automáticamente con cada cambio en el código).*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
